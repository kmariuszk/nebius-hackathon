            Dissecting the multicellular ecosystem of metastatic melanoma by single-cell RNA-seq - PMC

<section class="pmc-layout__citation"><p><img src="https://cdn.ncbi.nlm.nih.gov/pmc/banners/logo-nihpa.png" alt="NIHPA Author Manuscripts logo" usemap="#pmc-banner-imagemap" width="500" height="75"></p></section>
<section aria-label="Article content"><section class="body main-article-body">
<p id="P7">To isolate viable single cells suitable for high-quality single-cell RNA-seq, we developed and implemented a rapid translational workflow (<a href="#F1" class="usa-link">Fig. 1A</a>).</p>
<figure class="fig xbox font-sm" id="F1"><h4 class="obj_head">Figure 1. Dissection of melanoma with single-cell RNA-seq.</h4>
<p class="img-box line-height-none margin-x-neg-2 tablet:margin-x-0 text-center"><a class="tileshop" target="_blank" href="https://www.ncbi.nlm.nih.gov/core/lw/2.0/html/tileshop_pmc/tileshop_pmc_inline.html?title=Click%20on%20image%20to%20zoom&amp;p=PMC3&amp;id=4944528_nihms791837f1.jpg"><img class="graphic zoom-in" src="https://cdn.ncbi.nlm.nih.gov/pmc/blobs/c11f/4944528/1f7a6569b280/nihms791837f1.jpg" loading="lazy" height="611" width="800" alt="Figure 1"></a></p>
<div class="p text-right font-secondary"><a href="figure/F1/" class="usa-link" target="_blank" rel="noopener noreferrer">Open in a new tab</a></div>
<figcaption><p><strong>(A)</strong> Overview of workflow. <strong>(B)</strong> Chromosomal landscape of inferred large-scale copy number variations (CNVs) distinguishes malignant from non-malignant cells. The Mel80 tumor is shown with individual cells (y-axis) and chromosomal regions (x-axis). Amplifications (red) or deletions (blue) were inferred by averaging expression over 100-gene stretches on the respective chromosomes. Inferred CNVs are concordant with calls from whole-exome sequencing (WES, bottom). <strong>(C,D)</strong> Single cell expression profiles distinguish malignant and non-malignant cell types. Shown are t-SNE plots of malignant (C, shown are the six tumors each with &gt;50 malignant cells) and non-malignant (D) cells (as called from inferred CNVs as in B) from 11 tumors with &gt;100 cells per tumor (color code). Clusters of non-malignant cells (called by DBScan, (<a href="#R17" class="usa-link" aria-describedby="R17">17</a>)) are marked by dashed ellipses and were annotated as T cells, B cells, macrophages, CAFs and endothelial cells, from preferentially expressed genes (<a href="#SD1" class="usa-link">Fig. S2</a>, <a href="#SD1" class="usa-link">Table S2–3</a>).</p></figcaption></figure>
<p id="P11">Cell cycle phase-specific signatures were highly expressed in a subset of malignant cells (<a href="#F2" class="usa-link">Figs. 2A</a>).</p>
<figure class="fig xbox font-sm" id="F2"><h4 class="obj_head">Figure 2. Single-cell RNA-seq distinguishes cell cycle and other states among malignant cells.</h4>
<p class="img-box line-height-none margin-x-neg-2 tablet:margin-x-0 text-center"><a class="tileshop" target="_blank" href="https://www.ncbi.nlm.nih.gov/core/lw/2.0/html/tileshop_pmc/tileshop_pmc_inline.html?title=Click%20on%20image%20to%20zoom&amp;p=PMC3&amp;id=4944528_nihms791837f2.jpg"><img class="graphic zoom-in" src="https://cdn.ncbi.nlm.nih.gov/pmc/blobs/c11f/4944528/48328c626293/nihms791837f2.jpg" loading="lazy" height="915" width="797" alt="Figure 2"></a></p>
<div class="p text-right font-secondary"><a href="figure/F2/" class="usa-link" target="_blank" rel="noopener noreferrer">Open in a new tab</a></div>
<figcaption><p>(<strong>A</strong>) Estimation of the cell cycle state of individual malignant cells (circles) on the basis of relative expression of G1/S (x-axis) and G2/M (y-axis) gene-sets in a low-cycling (Mel79, top) and a high-cycling (Mel78, bottom) tumor. Cells are colored by their inferred cell cycle states, with cycling cells (red), intermediate (light red) and non-cycling cells (black); cells with high expression of <em>KDM5B</em> (Z-score&gt;2) are marked in cyan filling. (<strong>B</strong>) IHC staining (40x magnification) for <em>Ki67+</em> cells shows concordance with the signature-based frequency of cycling cells for Mel79 and Mel78 (as for other tumors; <a href="#SD1" class="usa-link">Fig S4C</a>). (<strong>C</strong>) KDM5B/Ki67 staining (40x magnification) in corresponding tissue showing small clusters of KDM5B-high expressing cells negative for Ki67 (<a href="#SD1" class="usa-link">Fig. S4</a>). (<strong>D</strong>) An expression program specific to Region 1 of Mel79, identified on the basis of multifocal sampling. The relative expression of genes (rows) is shown for cells (columns) ordered by the average expression of the entire gene-set. The region-of-origin of each cell is indicated in the top panel (<a href="#SD1" class="usa-link">Fig. S5</a>).</p></figcaption></figure>
