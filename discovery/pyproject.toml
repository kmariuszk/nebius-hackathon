[project]
name = "discovery"
version = "0.1.0"
description = "Papers MCP and discovery pipeline for the paper discovery canvas"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28",
    "mcp==2.3.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
